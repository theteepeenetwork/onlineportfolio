name: QA battery

# BLOCKING gates (must pass to merge): static-security, security, a11y, e2e, ops.
# REPORT-ONLY (never blocks): ux, personas, findings, perf.
# See TEST_PLAN.md and FINDINGS.md.
#
# WHAT RUNS WHEN, AND WHY
#
# Every blocking gate runs on every push to main, on the nightly and on demand,
# unselected. That is the line that does not move: they are the executable form
# of SAFEGUARDING.md, and a gate that never runs is not a gate.
#
# On a PR they are selected by what changed, and the price came down a long way
# first — narrowing a suite that takes twenty minutes is a different decision
# from narrowing one that takes three. The batteries used to be dominated by the operator
# door: every ops test signed in for itself, TOTP replay protection is monotonic,
# and so each one queued for its own 30-second window. The a11y project spent
# 1,197 of its 1,305 seconds watching that clock. The door is now walked once per
# worker and the session reused (tests/battery/helpers.ts, `asOperator`), which
# took a11y from 17.4 to 2.9 minutes and let the security project finish at all —
# 306 tests in 8.9 minutes, where it previously had not reached test 200 in 25.
# The blocking suites are then sharded across runners below, so wall-clock is
# roughly a third of that again.
#
# The REPORT-ONLY suites never blocked a merge, so paying for them on every PR
# bought nothing but waiting: they run on main, nightly, on demand, and on any PR
# labelled `full-battery` when someone wants the personas' opinion before merging.
#
# WHAT A PR RUNS, AND WHY THAT IS SAFE
#
# On a PR, the BLOCKING suites are selected by what changed
# (scripts/select-suites.mjs, self-tested by `npm run check`). A change under
# src/components cannot move the operator screens, so it does not run the
# operator specs; a change under src/lib/ops cannot move a child's jar, so it
# does not run the e2e suite. That is not a guess. It is what
# check-ops-blindness.mjs already enforces, deny-by-default, on every PR: ops
# code may import @/lib/ops/* and five named modules, and those five select both
# sides. Anything the selector does not recognise — a new directory, a moved
# file, a changed allowlist — selects EVERYTHING.
#
# And the net under all of it: every push to `main` runs the whole battery,
# unselected, as does the nightly and `workflow_dispatch`. The worst a wrong
# rule can do is move a red gate from the PR to the merge minutes later, not
# hide it. `full-battery` on a PR opts back into the lot.
#
# The static gates are never selected away. They cost about a minute for the
# whole repository and they catch the class of breakage that used to take three
# suites down at once.

on:
  pull_request:
    # A change that cannot alter behaviour does not need the battery. Kept tight
    # on purpose: anything that is not prose is code until proven otherwise.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "Context/**"
      - "Themeing/**"
      - "LICENSE"
  push:
    branches: [main]
  schedule:
    # Nightly, for the report-only suites the PR path no longer pays for.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:./dev.db"

jobs:
  # ---- What does this change need? ----
  # Only ever narrows a PR. Everything else in this file runs the lot.
  select:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.pick.outputs.security }}
      a11y: ${{ steps.pick.outputs.a11y }}
      e2e: ${{ steps.pick.outputs.e2e }}
      ops: ${{ steps.pick.outputs.ops }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          FULL_BATTERY="${{ contains(github.event.pull_request.labels.*.name, 'full-battery') }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "$FULL_BATTERY" = "true" ]; then
            echo "Not a PR, or labelled full-battery — running everything."
            printf 'security=true\na11y=true\ne2e=true\nops=true\nreason=unselected\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          # Quoted: the selector splits on newlines itself, and a filename with a
          # space must not word-split into fragments that look unclassified.
          node scripts/select-suites.mjs --github "$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Say what was chosen
        run: |
          {
            echo "### Suites selected for this change"
            echo
            echo "\`${{ steps.pick.outputs.reason }}\`"
            echo
            echo "| suite | runs |"
            echo "| --- | --- |"
            echo "| security | ${{ steps.pick.outputs.security }} |"
            echo "| a11y | ${{ steps.pick.outputs.a11y }} |"
            echo "| e2e | ${{ steps.pick.outputs.e2e }} |"
            echo "| operator | ${{ steps.pick.outputs.ops }} |"
            echo
            echo "Every push to \`main\` runs all of it. Add the \`full-battery\` label to run it here."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Fast static gates (blocking) ----
  static-security:
    name: Static security gates (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      # The cheapest gate in the file, and the one whose absence let a broken
      # merge reach main on 16 August 2026. A conflict resolution dropped three
      # import lines from a server action; every gate we had runs the app
      # through `next dev`, which compiles lazily and only fails when a request
      # reaches the broken path, so three suites went red for one cause and
      # nothing said why. `tsc` names it in about a second. It runs FIRST for
      # that reason: a type error means nothing below it is worth running.
      - name: Typecheck (catches broken merges before any suite runs)
        run: npx tsc --noEmit
      - name: No unsafe raw queries / dangerouslySetInnerHTML
        run: node scripts/audit-static.mjs
      - name: Reduced-motion guard (rule 18)
        run: node scripts/audit-motion.mjs
      - name: R2 tripwire (media migration guard)
        run: node scripts/check-r2-tripwire.mjs
      # The operator console is structurally blind to children's work, and this
      # is what enforces it. It runs BEFORE any ops screen exists, on purpose: a
      # screen written before the gate is a screen the gate never checked while
      # it was being written. The self-test is a separate step so a corpus that
      # has quietly stopped proving anything shows up as its own red line.
      - name: Ops blindness gate (rules 4, 5, 8, 11)
        run: node scripts/check-ops-blindness.mjs
      - name: Ops blindness gate self-test (proves it still fires)
        run: node scripts/check-ops-blindness.mjs --self-test
      - name: Production dependency audit (fail on high)
        run: npm run audit:prod
      - name: Error-string audit (report-only)
        run: node scripts/error-string-audit.mjs || true

  # ---- Security battery (blocking) ----
  # Sharded across runners rather than parallelised in-process: the suites share
  # one SQLite database and mutate sessions and rows, so `workers: 1` has to
  # stand. A shard is its own runner with its own database and its own dev
  # server, which is the same isolation by another route — and it splits by
  # file, so nothing is skipped and no test sees a neighbour it did not see
  # before.
  security:
    name: Security tests (blocking) ${{ matrix.shard }}/2
    needs: select
    if: needs.select.outputs.security == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npx prisma db push
      # The operator specs are their own job below, selected separately. The
      # filter is a path regex, not a project: `--project=security` still means
      # the whole security project everywhere else, and cannot quietly come to
      # mean less than it says.
      - name: Security project (product)
        run: npx playwright test -c playwright.battery.config.ts --project=security 'security/(?!ops-)' --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: security-report-${{ matrix.shard }}
          path: playwright-report/battery
          retention-days: 14

  # ---- Accessibility battery (blocking, WCAG 2.2 AA baseline) ----
  a11y:
    name: Accessibility tests (blocking)
    needs: select
    if: needs.select.outputs.a11y == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npx prisma db push
      - name: a11y project, product screens (fails on NEW serious/critical AA violations)
        run: npx playwright test -c playwright.battery.config.ts --project=a11y 'a11y/(?!ops-)'

  # ---- Functional E2E (blocking) ----
  e2e:
    name: Functional E2E (blocking) ${{ matrix.shard }}/3
    needs: select
    if: needs.select.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npx prisma db push
      - run: npx playwright test --shard=${{ matrix.shard }}/3

  # ---- The operator area (blocking, selected) ----
  #
  # Its own job because it is the expensive one and the most isolated one. The
  # door is the slowest thing in the battery even after `asOperator`: three tests
  # in ops-auth.spec.ts have to cross a real 30-second TOTP boundary to prove
  # what they prove, and they should keep doing that. What changed is who waits
  # for them — a change to a teacher's register no longer does.
  ops:
    name: Operator area (blocking)
    needs: select
    if: needs.select.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npx prisma db push
      - name: Operator security + a11y specs
        run: npx playwright test -c playwright.battery.config.ts --project=security --project=a11y '(security|a11y)/ops-'

  # ---- Report-only: UX + personas + findings + perf (never blocks merge) ----
  #
  # Not on the PR path any more. None of it can block a merge, so running it on
  # every PR bought nothing that reading it the next morning does not. It runs
  # on main, nightly, on demand — and on a PR that asks for it with the
  # `full-battery` label, which is the case it is worth waiting for: a change to
  # copy, a flow or a child-facing screen, where the personas' opinion is the
  # point. `npm run test:personas` locally is the same thing, faster.
  report-only:
    name: UX / personas / findings / perf (report-only)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-battery')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npx prisma db push
      - name: UX project
        run: npx playwright test -c playwright.battery.config.ts --project=ux
        continue-on-error: true
      # The user-tester team: personas who use the product for real (a platform
      # operator, teachers, a business manager, parents, a child in each
      # register, and a fuzzing bot in a child's session) and write down what
      # confused, stalled or broke. Report-only for the same reason as `ux`: a
      # persona's judgement is evidence for a person to weigh, not a merge gate.
      # A persona test only fails on a BLOCKER — an unhandled error, a 5xx, or a
      # job the tester could not finish — which is why it is worth reading the
      # step even though it cannot block.
      - name: User-tester team (personas)
        run: npx playwright test -c playwright.battery.config.ts --project=personas
        continue-on-error: true
      - name: Rebuild the tester report
        if: ${{ !cancelled() }}
        run: node scripts/persona-report.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: user-testing-report, path: USER_TESTING.md, retention-days: 14 }
      - name: Security findings (documents open gaps — expected to fail)
        run: npx playwright test -c playwright.battery.config.ts --project=security-findings
        continue-on-error: true
      - name: Lighthouse performance budgets
        run: npm run test:perf
        continue-on-error: true
